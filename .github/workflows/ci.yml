name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel a run in-progress when a newer commit is available
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

#use the uv version that the actions/setup-uv@v6 action installs
env:
  UV_PYTHON_PREFERENCE: only-system   # use the Python from actions/setup-python

jobs:

  #Unit test Job starts here
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # No database is needed: tests/conftest.py supplies dummy settings
      - name: Run unit tests
        run: uv run pytest tests/unit -v


  # Integration-tests job: checking that the separate parts of this app work correctly together, not just on their own.
  integration-tests:
    name: Integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    # A real Postgres for this job only; it is thrown away when the job ends
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: realmile
          POSTGRES_PASSWORD: realmile
          POSTGRES_DB: realmile_test
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections
        options: >-
          --health-cmd "pg_isready -U realmile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for the throwaway database above, not real secrets
    env:
      DATABASE_URL: postgresql+asyncpg://realmile:realmile@localhost:5432/realmile_test
      DATABASE_SSL: "false"   # the CI Postgres has no SSL (Neon does)
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - name: Checkout the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run python -m app.migrate

      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit --cov=app
          uv run pytest tests/integration --cov=app --cov-append --cov-report=xml

      - name: Save tests coverage
        id: coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.xml

  sonarQube:
    name: Using the sonarqube cloud
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v7
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0

    - name: Download coverage.xml uploaded from the integration job
      id: d-artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: coverage


    - name: Static Application Security Test (SAST) with SonarQube 
      uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=slyytata
          -Dsonar.projectKey=SlyyTata_eks-deployment
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.coverage.exclusions=tests/**,frontend/**,alembic/**,app/migrate.py,main.py
          -Dsonar.python.version=3.14
          -Dsonar.qualitygate.wait=true
          -Dsonar.exclusions=coverage.xml


      # posts an alert to the team's Slack channel
  notify-slack:
    name: Send custom event details to a Slack workflow
    needs: [unit-tests, integration-tests, sonarQube]
    runs-on: ubuntu-latest
    if: always()   # run even if a job above failed or was skipped
    permissions: {}
    steps:
      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          payload-delimiter: "_"
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
            repository: ${{ github.repository }}
            unit-tests: ${{ needs.unit-tests.result }}
            integration: ${{ needs.integration-tests.result }}
            sonarqube: ${{ needs.sonarQube.result }}
            branch: ${{ github.ref_name }}
            event: ${{ github.event_name }}
            actor: ${{ github.actor }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
